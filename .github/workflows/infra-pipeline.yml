name: Terraform Infrastructure Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infra-pipeline.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Plan and Apply

    runs-on: [self-hosted, Windows, X64]

    timeout-minutes: 60

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

      - name: Configure EKS Access
        run: aws eks update-kubeconfig --region ap-southeast-2 --name nodejs-eks-cluster

      - name: Verify ArgoCD Installation
        run: |
          terraform state list
          kubectl get namespace argocd
          kubectl get pods -n argocd
          kubectl get deployments -n argocd